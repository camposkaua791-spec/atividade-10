<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Smart Control</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-container">
    <form class="login-form" action="dashboard.html">
        <h2>Smart Control</h2>

        <label for="login-usuario" style="display: none;">Usuário</label>
        <input type="text" id="login-usuario" placeholder="Usuário" required>

        <label for="login-senha" style="display: none;">Senha</label>
        <input type="password" id="login-senha" placeholder="Senha" required>

        <button type="submit">Entrar</button>

        <p>
            Não possui conta?
            <a href="cadastro.html">Cadastre-se</a>
        </p>
    </form>
</div>

</body>
</html>

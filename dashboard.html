<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Smart Control</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="menu">
    <h1>Smart Control</h1>

    <nav>
        <ul class="nav-links">
            <li><a href="#">Início</a></li>
            <li><a href="#">Sensores</a></li>
            <li><a href="#">Monitoramento</a></li>
            <li><a href="#">Relatórios</a></li>
        </ul>
    </nav>
</header>

<main class="dashboard">

    <div class="card">
        <span class="status">Ativo</span>
        <h2>Sensores</h2>
        <p>12 dispositivos conectados</p>
    </div>

    <div class="card">
        <span class="status">3 Alertas</span>
        <h2>Monitoramento</h2>
        <p>Alertas pendentes</p>
    </div>

    <div class="card">
        <span class="status">Online</span>
        <h2>Sistema</h2>
        <p>Funcionando normalmente</p>
    </div>

    <div class="card">
        <span class="status">OK</span>
        <h2>Energia</h2>
        <p>Consumo estável</p>
    </div>

</main>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Smart Control</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body>

    <!-- Barra de Navegação -->
    <header class="navbar">
        <!-- Botão do Menu Lateral (Sidebar) para Celular -->
        <button id="btnMenuToggle" class="btn-menu">☰ Menu</button>
        <h2>Smart Control</h2>
        <!-- Botão Dark Mode / Light Mode -->
        <button id="btnTema" class="btn-tema">🌙 Tema</button>[span_1](start_span)[span_1](end_span)
    </header>

    <div class="container-principal">
        <!-- Menu Lateral Colapsável (Sidebar) -->
        <aside id="sidebar" class="sidebar">
            <ul>
                <li><a href="#">Dashboard</a></li>
                <li><a href="#">Dispositivos</a></li>
                <li><a href="#">Métricas</a></li>
                <li><a href="#">Configurações</a></li>
            </ul>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="content">
            <!-- Mensagem de Saudação Dinâmica -->
            <h1 id="saudacao">Carregando saudação...</h1>

            <!-- Campo de Busca -->
            <div class="search-box">
                <input type="text" id="campoBusca" placeholder="Pesquisar itens, dispositivos ou métricas...">[span_2](start_span)[span_2](end_span)
            </div>

            <!-- Lista / Itens para testar o filtro de busca -->
            <div class="grid-itens">
                <div class="item-tabela card-metrica">Sensor de Temperatura: <span class="valor-metrica">25</span>°C</div>
                <div class="item-tabela card-metrica">Sensor de Umidade: <span class="valor-metrica">60</span>%</div>
                <div class="item-tabela card-metrica">Lâmpada Inteligente - Corredor</div>
                <div class="item-tabela card-metrica">Câmera de Segurança - Portaria</div>
            </div>
        </main>
    </div>

    <!-- Script JavaScript no final do body -->
    <script src="assets/js/main.js"></script>
</body>
</html>

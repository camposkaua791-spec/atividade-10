<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Smart Control</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <button id="btnMenuToggle">☰ Menu</button>
        <h2>Smart Control</h2>
        <button id="btnTema">🌙 Alternar Tema</button>
    </header>

    <div class="layout-container">
        <aside id="sidebar">
            <h3>Navegação</h3>
            <ul style="list-style: none; padding: 0; margin-top: 15px;">
                <li style="padding: 8px 0;"><a href="#">Início</a></li>
                <li style="padding: 8px 0;"><a href="#">Clientes</a></li>
                <li style="padding: 8px 0;"><a href="#">Pedidos</a></li>
                <li style="padding: 8px 0;"><a href="#">Produtos</a></li>
            </ul>
        </aside>

        <main>
            <h2 id="saudacao" style="margin-bottom: 20px;">Carregando saudação...</h2>

            <div style="margin-bottom: 20px;">
                <input type="text" id="campoBusca" placeholder="Pesquisar nos cards..." style="padding: 10px; width: 100%; max-width: 400px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-card); color: var(--text-main);">
            </div>

            <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                <div class="item-tabela" style="min-width: 150px;">
                    Clientes: <span class="valor-metrica">320</span>
                    <br><span class="status-badge status-ativo">Ativo</span>
                </div>
                <div class="item-tabela" style="min-width: 150px;">
                    Pedidos: <span class="valor-metrica">98</span>
                    <br><span class="status-badge status-alerta">Alerta</span>
                </div>
                <div class="item-tabela" style="min-width: 150px;">
                    Produtos: <span class="valor-metrica">42</span>
                    <br><span class="status-badge status-inativo">Inativo</span>
                </div>
            </div>

            <div class="item-tabela" style="margin-top: 25px;">
                <h3 style="margin-top: 0; color: var(--accent);">Parametrização de Rede / Dispositivo</h3>
                <form id="formParametrizacao" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div>
                        <label for="ipDispositivo" style="display: block; font-size: 0.9rem; margin-bottom: 5px;">Endereço IP (Regex)</label>
                        <input type="text" id="ipDispositivo" placeholder="Ex: 192.168.0.1" required style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-main); color: var(--text-main);">
                    </div>
                    <div>
                        <label for="emailContato" style="display: block; font-size: 0.9rem; margin-bottom: 5px;">E-mail de Alerta</label>
                        <input type="email" id="emailContato" placeholder="admin@smartcontrol.com" required style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-main); color: var(--text-main);">
                    </div>
                    <div style="grid-column: span 2;">
                        <button type="submit" style="padding: 10px 20px; background: var(--accent); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">Salvar Parâmetros</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="main.js"></script>
</body>
</html>

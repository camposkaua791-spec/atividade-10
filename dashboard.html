<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Dashboard - Smart Control</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Smart Control Dashboard</h1>
    </header>

    <main>

        <div class="card">
            <span class="badge">Ativo</span>
            <h2>Sensores</h2>
            <p>12 dispositivos conectados</p>
        </div>

        <div class="card">
            <span class="badge">3 Alertas</span>
            <h2>Monitoramento</h2>
            <p>Alertas pendentes</p>
        </div>

        <div class="card">
            <span class="badge">Online</span>
            <h2>Sistema</h2>
            <p>Funcionando normalmente</p>
        </div>

        <div class="card">
            <span class="badge">OK</span>
            <h2>Energia</h2>
            <p>Consumo estável</p>
        </div>

    </main>

</body>

</html>

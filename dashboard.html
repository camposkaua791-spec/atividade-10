<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Smart Control</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body>

    <!-- Barra de Navegação Superior -->
    <header style="display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #222; color: #fff;">
        <button id="btnMenuToggle" style="padding: 8px 12px; cursor: pointer;">☰ Menu</button>
        <h2>Smart Control</h2>
        <button id="btnTema" style="padding: 8px 12px; cursor: pointer;">🌙 Alternar Tema</button>
    </header>

    <div style="display: flex;">
        <!-- Menu Lateral (Sidebar para Celular) -->
        <aside id="sidebar" style="width: 220px; background: #333; color: #fff; padding: 20px; min-height: 80vh; display: block;">
            <h3>Navegação</h3>
            <ul style="list-style: none; padding: 0; margin-top: 15px;">
                <li style="padding: 8px 0;"><a href="#" style="color: #fff; text-decoration: none;">Início</a></li>
                <li style="padding: 8px 0;"><a href="#" style="color: #fff; text-decoration: none;">Clientes</a></li>
                <li style="padding: 8px 0;"><a href="#" style="color: #fff; text-decoration: none;">Pedidos</a></li>
                <li style="padding: 8px 0;"><a href="#" style="color: #fff; text-decoration: none;">Produtos</a></li>
            </ul>
        </aside>

        <!-- Conteúdo Principal -->
        <main style="flex: 1; padding: 20px;">
            <!-- Saudação Dinâmica -->
            <h2 id="saudacao" style="margin-bottom: 20px; color: #333;">Carregando saudação...</h2>

            <!-- Campo de Busca -->
            <div style="margin-bottom: 20px;">
                <input type="text" id="campoBusca" placeholder="Pesquisar nos cards..." style="padding: 10px; width: 100%; max-width: 400px; border: 1px solid #ccc; border-radius: 4px;">
            </div>

            <!-- Cards de Métricas (Exemplo para o filtro e métricas) -->
            <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                <div class="item-tabela" style="background: #f4f4f4; padding: 15px; border-radius: 5px; min-width: 150px;">
                    Clientes: <span class="valor-metrica">320</span>
                </div>
                <div class="item-tabela" style="background: #f4f4f4; padding: 15px; border-radius: 5px; min-width: 150px;">
                    Pedidos: <span class="valor-metrica">98</span>
                </div>
                <div class="item-tabela" style="background: #f4f4f4; padding: 15px; border-radius: 5px; min-width: 150px;">
                    Produtos: <span class="valor-metrica">42</span>
                </div>
            </div>
        </main>
    </div>

    <!-- Script Principal -->
    <script src="assets/js/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro - Smart Control</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-container">
    <form class="login-form" action="dashboard.html">
        <h2>Smart Control</h2>
        <p style="margin-top: 0; margin-bottom: 25px; font-weight: bold; color: #475569;">Cadastro</p>

        <input type="text" id="nome" placeholder="Nome Completo" required>
        <input type="email" id="email" placeholder="E-mail" required>
        <input type="password" id="senha" placeholder="Senha" required>
        
        <label for="dataNascimento" style="display: block; text-align: left; font-size: 12px; color: #475569; margin-bottom: 5px;">Data de Nascimento</label>
        <input type="date" id="dataNascimento" required>

        <div style="margin-bottom: 15px;">
            <button type="submit" style="background: #16a34a; color: white; padding: 12px; border: none; border-radius: 8px; cursor: pointer; width: 100%; font-size: 15px; font-weight: bold;">Cadastrar</button>
        </div>

        <div>
            <a href="index.html" style="color: #2563eb; text-decoration: none; font-weight: bold; font-size: 14px;">Já possui conta? Faça login</a>
        </div>
    </form>
</div>

</body>
</html>

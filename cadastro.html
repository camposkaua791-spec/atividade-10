<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro - Smart Control</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-container">
    <form class="login-form" action="dashboard.html" style="text-align: left;">
        <h2 style="text-align: center; margin-bottom: 25px; color: #0f172a;">Cadastro de Usuário</h2>

        <div style="margin-bottom: 15px;">
            <label for="nome" style="display: block; font-size: 14px; color: #475569; margin-bottom: 5px;">Nome</label>
            <input type="text" id="nome" required style="width: 100%; padding: 12px 15px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 14px;">
        </div>

        <div style="margin-bottom: 15px;">
            <label for="email" style="display: block; font-size: 14px; color: #475569; margin-bottom: 5px;">E-mail</label>
            <input type="email" id="email" required style="width: 100%; padding: 12px 15px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 14px;">
        </div>

        <div style="margin-bottom: 15px;">
            <label for="senha" style="display: block; font-size: 14px; color: #475569; margin-bottom: 5px;">Senha</label>
            <input type="password" id="senha" required style="width: 100%; padding: 12px 15px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 14px;">
        </div>

        <div style="margin-bottom: 20px;">
            <label for="dataNascimento" style="display: block; font-size: 14px; color: #475569; margin-bottom: 5px;">Data de nascimento</label>
            <input type="date" id="dataNascimento" required style="width: 100%; padding: 12px 15px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 14px; background: #ffffff;">
        </div>

        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 25px;">
            <input type="checkbox" id="termos" required style="width: 18px; height: 18px; cursor: pointer;">
            <label for="termos" style="font-size: 14px; color: #475569; cursor: pointer;">Aceito os termos de uso</label>
        </div>

        <div style="text-align: center; margin-bottom: 15px;">
            <button type="submit" style="background: #1e293b; color: white; padding: 12px 30px; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: bold; width: 100%;">Cadastrar</button>
        </div>

        <div style="text-align: center;">
            <a href="index.html" style="color: #2563eb; text-decoration: none; font-weight: bold; font-size: 14px;">Já possui conta? Faça login</a>
        </div>
    </form>
</div>

</body>
</html>

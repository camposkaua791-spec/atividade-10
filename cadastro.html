<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - Smart Control</title>
</head>
<body>

    <img src="assets/images/logo.png" alt="Logo Smart Control" width="150">

    <h1>Cadastro de Usuário</h1>

    <form>

        <label for="nome">Nome Completo:</label><br>
        <input type="text" id="nome" required><br><br>

        <label for="email">E-mail Corporativo:</label><br>
        <input type="email" id="email" required><br><br>

        <label for="senha">Senha:</label><br>
        <input type="password" id="senha" minlength="8" required><br><br>

        <label for="nivel">Nível de Acesso:</label><br>
        <select id="nivel" required>
            <option value="">Selecione</option>
            <option>Administrador</option>
            <option>Gerente</option>
            <option>Usuário</option>
        </select>

        <br><br>

        <input type="checkbox" id="termos" required>
        <label for="termos">Aceito os Termos de Uso</label>

        <br><br>

        <button type="submit">Cadastrar</button>

    </form>

    <br>

    <a href="index.html">Voltar ao Login</a>

</body>
</html>

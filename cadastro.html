<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro - Smart Control</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-container">
    <form class="login-form" action="dashboard.html">
        <h2>Criar Conta</h2>

        <label for="nome" style="display: none;">Nome Completo</label>
        <input type="text" id="nome" placeholder="Nome Completo" required>

        <label for="email" style="display: none;">E-mail</label>
        <input type="email" id="email" placeholder="E-mail" required>

        <label for="usuario" style="display: none;">Usuário</label>
        <input type="text" id="usuario" placeholder="Usuário" required>

        <label for="senha" style="display: none;">Senha</label>
        <input type="password" id="senha" placeholder="Senha" required>

        <button type="submit">Cadastrar</button>

        <p>
            Já possui conta?
            <a href="index.html">Fazer Login</a>
        </p>
    </form>
</div>

</body>
</html>
